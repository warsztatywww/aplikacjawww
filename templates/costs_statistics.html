{% extends "base.html" %}

{% block content %}
  <article>
    <h1 class="mt-3">{{ title }}</h1>
    <form method="get" class="mb-3">
      <div class="form-row">
        <div class="col-md-3">
          <label for="statistics-camp">Obóz</label>
          <select id="statistics-camp" name="camp" class="form-control">
            {% for camp in camps %}
              <option value="{{ camp.pk }}"{% if camp == selected_camp %} selected{% endif %}>{{ camp }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label for="statistics-status">Status faktury</label>
          <select id="statistics-status" name="status" class="form-control">
            <option value="">Zatwierdzone i przetworzone</option>
            {% for value, label in status_choices %}
              <option value="{{ value }}"{% if value == selected_status %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label for="statistics-category">Kategoria</label>
          <select id="statistics-category" name="category" class="form-control">
            <option value="">Wszystkie</option>
            {% for value, label in category_choices %}
              <option value="{{ value }}"{% if value == selected_category %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label for="statistics-context">Kontekst</label>
          <select id="statistics-context" name="context" class="form-control">
            <option value="">Obóz i warsztaty</option>
            <option value="camp"{% if selected_context == 'camp' %} selected{% endif %}>Obóz</option>
            <option value="workshop"{% if selected_context == 'workshop' %} selected{% endif %}>Warsztaty</option>
          </select>
        </div>
      </div>
      <button class="btn btn-secondary mt-2" type="submit">Filtruj</button>
    </form>

    <p>Łącznie: {{ total }} zł</p>
    <div role="img" aria-label="Wykres kołowy wydatków według kategorii"
         style="width: 14rem; height: 14rem; border-radius: 50%; background: {{ pie_gradient }};"></div>
    <table class="table mt-3">
      <caption>Wydatki według kategorii</caption>
      <thead>
        <tr><th scope="col">Kategoria</th><th scope="col">Kwota</th><th scope="col">Udział</th></tr>
      </thead>
      <tbody>
        {% for row in category_rows %}
          <tr><td>{{ row.label }}</td><td>{{ row.total }} zł</td><td>{{ row.percentage }}%</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </article>
{% endblock %}
